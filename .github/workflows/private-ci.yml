name: Private CI

on:
  push:
    branches:
      - private-site-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew testAppDebugUnitTest assembleAppDebug \
            --build-cache \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: penrix-private-debug
          if-no-files-found: error
          path: app/build/outputs/apk/app/debug/*.apk
