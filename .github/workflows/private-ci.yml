name: Private CI

on:
  push:
    branches:
      - private-site-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate managed book-source JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('app/src/main/assets/privateSites/bookSources')
          files = sorted(root.glob('*.json'))
          if not files:
              raise SystemExit('No managed book-source JSON files found')

          seen_urls = set()
          for path in files:
              with path.open('r', encoding='utf-8') as fh:
                  data = json.load(fh)

              for key in ('bookSourceName', 'bookSourceUrl', 'bookSourceGroup', 'ruleSearch', 'ruleContent'):
                  if key not in data:
                      raise SystemExit(f'{path}: missing required key {key}')

              if 'Penrix 内置' not in [part.strip() for part in str(data['bookSourceGroup']).split(',')]:
                  raise SystemExit(f'{path}: missing managed group')

              url = str(data['bookSourceUrl'])
              if 'penrix_builtin=' not in url:
                  raise SystemExit(f'{path}: missing managed key marker')
              if url in seen_urls:
                  raise SystemExit(f'{path}: duplicate bookSourceUrl {url}')
              seen_urls.add(url)

          print(f'Validated {len(files)} managed book-source JSON files')
          PY

      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew testAppDebugUnitTest assembleAppDebug \
            --build-cache \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: penrix-private-debug
          if-no-files-found: error
          path: app/build/outputs/apk/app/debug/*.apk
